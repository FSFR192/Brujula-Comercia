openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Asistente de escenarios con contexto sintético
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/respond:
    post:
      operationId: assistantRespond
      tags: [assistant]
      summary: Explain a synthetic scenario
      description: Returns a Spanish explanation for a zone, analyst, or committee scenario. Does not change compensation or assess credit eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantRequest"
      responses:
        "200":
          description: Assistant explanation, generated by AI or a safe template fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          description: Invalid assistant request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Temporary rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [zona, analista, comite]
        message:
          type: string
          minLength: 1
          maxLength: 2000
        context:
          type: string
          maxLength: 12000
      required:
        - mode
        - message
    AssistantResponse:
      type: object
      properties:
        answer:
          type: string
        source:
          type: string
          enum: [ia, plantilla]
      required:
        - answer
        - source
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

